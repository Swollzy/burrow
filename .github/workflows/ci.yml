name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Tests (Linux Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu mirror is sometimes very slow, so the .deb files are cached between runs.
      - name: Restore cached packages
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-noble-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-noble-
      - name: Install Wine, MinGW and ShellCheck
        timeout-minutes: 15
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-burrow-ci >/dev/null
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          # Only what the tests use: 64-bit Wine, the 64-bit MinGW C compiler, no recommended extras.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wine64 wine gcc-mingw-w64-x86-64-posix mingw-w64-x86-64-dev shellcheck xvfb xauth
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: ShellCheck
        run: shellcheck -S warning -s bash bin/burrow install.sh tests/run-tests.sh scripts/package.sh
      - name: Steam wrapper builds
        run: x86_64-w64-mingw32-gcc -O2 -municode -mwindows -static -s -o /tmp/steamwebhelper.exe wrapper/steamwebhelper-wrapper.c
      - name: Tests
        run: tests/run-tests.sh

  macos:
    name: Mac app builds
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse with the system bash 3.2
        run: /bin/bash -n bin/burrow && /bin/bash -n install.sh
      - name: Settings, snapshots and bottles under the system bash 3.2
        run: |
          export BURROW_HOME="$RUNNER_TEMP/bash32"
          b="/bin/bash bin/burrow"
          $b settings --list >/dev/null
          $b presets --plain | grep -q '^retro'
          # A stand-in bottle; Wine isn't installed here, so registry settings wait for the next start.
          mkdir -p "$BURROW_HOME/bottles/Test/prefix/drive_c" && touch "$BURROW_HOME/bottles/Test/bottle.conf"
          $b settings Test retina=on dpi=144 virtual_desktop=1280x800
          $b settings Test dpi | grep -qx 144
          ! $b settings Test dpi 5000 2>/dev/null
          $b settings Test preset legacy
          $b settings Test --plain | grep -q "^windows_version	win7	bottle	"
          $b bottle list --plain | grep -q "^Test	compat	win7	legacy	off$"
          $b snapshot save Test "first"
          $b snapshot list Test --plain | grep -q "	first	"
          $b bottle clone Test Copy
          test -d "$BURROW_HOME/bottles/Copy/prefix/drive_c"
          $b bottle delete Copy --yes
          $b usage --plain | grep -q "^DISK	snapshot	"
      - name: Compile the window app
        run: |
          swiftc -O -swift-version 5 -parse-as-library -target arm64-apple-macos13.0 app/BurrowApp.swift -o /tmp/Burrow-arm64
          swiftc -O -swift-version 5 -parse-as-library -target x86_64-apple-macos13.0 app/BurrowApp.swift -o /tmp/Burrow-x86_64
      - name: Compile the simple menu app
        run: |
          sed 's|__BURROW_CLI__|/tmp/burrow|' app/Burrow.applescript > /tmp/Burrow.applescript
          osacompile -l AppleScript -o /tmp/Burrow.app /tmp/Burrow.applescript
      - name: burrow app builds Burrow.app
        run: |
          export BURROW_HOME="$RUNNER_TEMP/burrow-home"
          bin/burrow app "$RUNNER_TEMP/Burrow.app"
          test -x "$RUNNER_TEMP/Burrow.app/Contents/MacOS/Burrow" || { cat "$BURROW_HOME/logs/app-build.log"; exit 1; }
          bin/burrow status
          bin/burrow doctor

  release:
    name: Release zip
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^BURROW_VERSION="\(.*\)"$/\1/p' bin/burrow)
          [ "$tag" = "$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match BURROW_VERSION $version"; exit 1; }
          echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true
